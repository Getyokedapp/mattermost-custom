name: Custom Image

# Builds the patched server from the *latest upstream release* plus whatever
# patches/ and deploy/ hold on master, whenever either changes. The release sync
# only runs when upstream cuts a tag; this covers the other direction, where we
# change a patch or a deployed file and want an image without waiting for upstream.
#
# Publishes :edge (what the host watches) and :mm-<tag>-<sha> for pinning to the
# internal registry at registry.internal.getyokedapp.com.

on:
  push:
    branches: [master]
    paths:
      - 'patches/**'
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/custom-image.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: custom-image
  cancel-in-progress: true

env:
  UPSTREAM_REPO: mattermost/mattermost

jobs:
  image:
    name: Build patched image
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: image/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0

      - name: image/resolve-upstream-tag
        id: tag
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream 'refs/tags/v*:refs/tags/v*'
          tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          [ -n "$tag" ] || { echo "::error::no final upstream tag found"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "building ${tag}"

      - name: image/apply-patches
        run: |
          set -euo pipefail
          tag='${{ steps.tag.outputs.tag }}'
          mkdir -p "$RUNNER_TEMP/patches"
          cp patches/*.patch "$RUNNER_TEMP/patches/"
          git switch --detach "refs/tags/${tag}"
          for patch in "$RUNNER_TEMP"/patches/*.patch; do
            git apply -v "${patch}"
          done

      - name: image/setup-go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum

      - name: image/build
        env:
          GOPRIVATE: github.com/mattermost/*
        run: |
          cd server
          make build-linux-amd64

      - name: image/publish
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: registry.internal.getyokedapp.com
          REGISTRY_REPO: getyokedapp/mattermost-custom
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="${REGISTRY}/${REGISTRY_REPO}"
          short="$(git rev-parse --short HEAD)"

          # Local base only: the published image manifest already carries every
          # layer, so there is no need to store a second tag for it.
          base="mattermost-base:${TAG}"
          docker build \
            --build-arg "MM_PACKAGE=https://releases.mattermost.com/${version}/mattermost-enterprise-${version}-linux-amd64.tar.gz" \
            -t "$base" \
            --file server/build/Dockerfile server/build

          binary="$(find server/bin -type f -name mattermost -print -quit)"
          [ -n "$binary" ] || { echo "::error::patched binary not found"; exit 1; }

          ctx="$(mktemp -d)"
          install -D -m 0755 "$binary" "${ctx}/bin/mattermost"
          printf 'FROM %s\nCOPY --chown=2000:2000 bin/mattermost /mattermost/bin/mattermost\n' \
            "$base" > "${ctx}/Dockerfile"

          docker build \
            -t "${image}:edge" \
            -t "${image}:mm-${TAG}-${short}" \
            --file "${ctx}/Dockerfile" "$ctx"

          docker run --rm --entrypoint /mattermost/bin/mattermost "${image}:edge" version

          # Worker request bodies are capped by the zone plan, so save the image
          # and let the pusher upload each layer in chunks. Docker's own
          # `docker push` would send each layer as one request and 413 on the
          # large enterprise layers.
          docker save -o "${RUNNER_TEMP}/mattermost-image.tar" "${image}:edge"

          REGISTRY="$REGISTRY" node scripts/push-oci.mjs \
            --repo "$REGISTRY_REPO" \
            --tag edge \
            --tag "mm-${TAG}-${short}" \
            --docker-save "${RUNNER_TEMP}/mattermost-image.tar"

          echo "pushed ${image}:edge and ${image}:mm-${TAG}-${short}"

      - name: image/retain
        env:
          REGISTRY: registry.internal.getyokedapp.com
          REGISTRY_REPO: getyokedapp/mattermost-custom
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          # Keep the six newest pinned builds; :edge does not match the prefix.
          node scripts/prune-tags.mjs \
            --repo "$REGISTRY_REPO" --prefix mm- --keep 6 --apply
